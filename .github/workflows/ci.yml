name: Celestial Skill Tree CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build validateTree
      - uses: actions/upload-artifact@v4
        with:
          name: celestial-skill-tree
          path: build/libs/*.jar
