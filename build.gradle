plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('visualqa')) {
                systemProperty 'nostalgiaskills.visualqa', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        mpqaServer {
            server()
            gameDirectory = file('run_mpqa/server')
            programArgument '--nogui'
        }
        mpqaAlpha {
            client()
            gameDirectory = file('run_mpqa/alpha')
            programArguments.addAll('--username', 'Alpha')
            systemProperty 'nostalgiaskills.mpqa', (project.findProperty('mpqaAlpha') ?: 'alpha').toString()
            systemProperty 'nostalgiaskills.mpqa.address', '127.0.0.1:25565'
        }
        mpqaBeta {
            client()
            gameDirectory = file('run_mpqa/beta')
            programArguments.addAll('--username', 'Beta')
            systemProperty 'nostalgiaskills.mpqa', (project.findProperty('mpqaBeta') ?: 'beta').toString()
            systemProperty 'nostalgiaskills.mpqa.address', '127.0.0.1:25566'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") {
        transitive = false
    }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:jade:${jade_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:champions-unofficial:${champions_version}") {
        transitive = false
    }
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.test.java.srcDirs = ['test']

test {
    useJUnitPlatform()
    systemProperty 'nostalgiaskills.dataRoot', file('src/main/resources/data/nostalgiaskills').absolutePath
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.matching { it.name == 'runServer' || it.name == 'runMpqaServer' }.configureEach {
    standardInput = System.in
}

tasks.register('validateTree', JavaExec) {
    group = 'verification'
    description = 'Validates the skill catalog and generates one tree outside the game: -PtreeDir=<data dir> -Pseed=<n>'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nostalgiacraft.skills.generation.CatalogValidatorCli'
    args = [project.findProperty('treeDir') ?: 'src/main/resources/data', project.findProperty('seed') ?: '0']
}

tasks.register('previewTree', JavaExec) {
    group = 'verification'
    description = 'Draws the generated tree shape to a PNG: -Pclasses=6 -Pskills=100 -Pout=build/preview/tree.png'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nostalgiacraft.skills.generation.TreePreviewCli'
    systemProperty 'java.awt.headless', 'true'
    args = [project.findProperty('classes') ?: '6', project.findProperty('skills') ?: '100',
            project.findProperty('out') ?: 'build/preview/tree.png']
}
