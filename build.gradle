plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'com.modrinth.minotaur' version '2.10.0'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.named('jar') {
    manifest.attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors
    )
}

sourceSets {
    devHarness {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    packTest {
        compileClasspath += sourceSets.main.output + sourceSets.devHarness.output
        runtimeClasspath += sourceSets.main.output + sourceSets.devHarness.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.devHarness)
    addModdingDependenciesTo(sourceSets.packTest)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            sourceSet = sourceSets.devHarness
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('visualqa')) {
                systemProperty 'celestialskilltree.visualqa', 'true'
            }
            if (project.hasProperty('gallery')) {
                systemProperty 'celestialskilltree.gallery', 'true'
            }
            if (project.hasProperty('renderbench')) {
                systemProperty 'celestialskilltree.renderbench', 'true'
            }
        }
        server {
            sourceSet = sourceSets.devHarness
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        mpqaServer {
            sourceSet = sourceSets.devHarness
            server()
            gameDirectory = file('run_mpqa/server')
            programArgument '--nogui'
        }
        mpqaAlpha {
            sourceSet = sourceSets.devHarness
            client()
            gameDirectory = file('run_mpqa/alpha')
            programArguments.addAll('--username', 'Alpha')
            systemProperty 'celestialskilltree.mpqa', (project.findProperty('mpqaAlpha') ?: 'alpha').toString()
            systemProperty 'celestialskilltree.mpqa.address', '127.0.0.1:25565'
        }
        mpqaBeta {
            sourceSet = sourceSets.devHarness
            client()
            gameDirectory = file('run_mpqa/beta')
            programArguments.addAll('--username', 'Beta')
            systemProperty 'celestialskilltree.mpqa', (project.findProperty('mpqaBeta') ?: 'beta').toString()
            systemProperty 'celestialskilltree.mpqa.address', '127.0.0.1:25566'
        }
        gameTestServer {
            sourceSet = sourceSets.devHarness
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('bench')) {
                systemProperty 'celestialskilltree.bench', 'true'
            }
        }
        packGameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.packTest
            gameDirectory = file('run-pack')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.devHarness)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

def packTestMods = [
        'Apotheosis-', 'ApothicAttributes-', 'Placebo-', 'ars_nouveau-', 'irons_spellbooks-', 'irons_lib-',
        'bettercombat-neoforge-', 'better_mob_combat_reimagined-', 'player-animation-lib-forge-', 'cloth-config-',
        'champions-neoforge-', 'curios-neoforge-', 'caelus-neoforge-', 'dummmmmmy-', 'moonlight-', 'supplementaries-',
        'enigmaticlegacyplus-', 'forbidden_arcanus-', 'valhelsia_core-', 'l2hostility-', 'l2complements-', 'l2library-',
        'mowziesmobs-', 'geckolib-neoforge-', 'occultism-', 'modonomicon-', 'SmartBrainLib-', 'curseofpandora-', 'ParCool-',
        'relics-', 'OctoLib-', 'reliquary-', 'Patchouli-', 'scguns-', 'framework-neoforge-', 'kubejs-neoforge-', 'rhino-',
        'architectury-', 'Jade-', 'celestial_core-', 'ftb-ultimine-', 'ftb-library-', 'FarmersDelight-'
]

def packModsDir = providers.gradleProperty('pack_mods_dir').orElse(providers.environmentVariable('PACK_MODS_DIR')).orNull
def packJars = packModsDir ? fileTree(packModsDir) { include packTestMods.collect { "${it}*.jar" } } : files()
def packModsProblem = !packModsDir
        ? "Set pack_mods_dir in ~/.gradle/gradle.properties (or the PACK_MODS_DIR environment variable) to the pack's mods folder"
        : packTestMods.findAll { prefix -> !packJars.files.any { it.name.startsWith(prefix) } }
        .with { missing -> missing ? "Pack jars missing from ${packModsDir}: ${missing.collect { "${it}*.jar" }.join(', ')}" : null }

def copyKubeJsProbe = tasks.register('copyKubeJsProbe', Copy) {
    from 'src/packTest/kubejs'
    into 'run-pack/kubejs'
}

tasks.matching { it.name == 'runPackGameTestServer' }.configureEach {
    dependsOn copyKubeJsProbe
    doFirst {
        if (packModsProblem) {
            throw new GradleException(packModsProblem)
        }
    }
}

dependencies {
    packTestRuntimeOnly packJars
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") {
        transitive = false
    }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:jade:${jade_modrinth_version_id}") {
        transitive = false
    }
    compileOnly("maven.modrinth:champions-unofficial:${champions_modrinth_version_id}") {
        transitive = false
    }
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.test.java.srcDirs = ['test']

test {
    useJUnitPlatform()
    systemProperty 'celestialskilltree.dataRoot', file('src/main/resources/data/celestialskilltree').absolutePath
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            mod_issues_url         : mod_issues_url,
            mod_credits            : mod_credits
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.matching { it.name == 'runServer' || it.name == 'runMpqaServer' }.configureEach {
    standardInput = System.in
}

tasks.register('validateTree', JavaExec) {
    group = 'verification'
    description = 'Validates the skill catalog and generates one tree outside the game: -PtreeDir=<data dir> -Pseed=<n>'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.lesteoff.celestialskilltree.generation.CatalogValidatorCli'
    args = [project.findProperty('treeDir') ?: 'src/main/resources/data', project.findProperty('seed') ?: '0']
}

tasks.register('benchProgression', JavaExec) {
    group = 'verification'
    description = 'Times the progression rules (reconcile, refund, batch confirm, bulk purchase) on the shipped tree'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.lesteoff.celestialskilltree.generation.ProgressionBenchCli'
    args = [project.findProperty('treeDir') ?: 'src/main/resources/data']
}

tasks.register('previewTree', JavaExec) {
    group = 'verification'
    description = 'Draws the generated tree shape to a PNG: -Pclasses=6 -Pskills=100 -Pout=build/preview/tree.png'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.lesteoff.celestialskilltree.generation.TreePreviewCli'
    systemProperty 'java.awt.headless', 'true'
    args = [project.findProperty('classes') ?: '6', project.findProperty('skills') ?: '100',
            project.findProperty('out') ?: 'build/preview/tree.png']
}

def releaseNotes = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { text ->
    def section = text.split(/(?m)^## /).find { it.startsWith("[${mod_version}]") }
    section ? section.substring(section.indexOf('\n') + 1).trim() : ''
}

modrinth {
    token = providers.environmentVariable('MODRINTH_TOKEN')
    projectId = providers.environmentVariable('MODRINTH_PROJECT_ID')
    versionNumber = mod_version
    versionType = 'release'
    uploadFile = tasks.jar
    gameVersions = [minecraft_version]
    loaders = ['neoforge']
    changelog = releaseNotes
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    def projectId = providers.environmentVariable('CURSEFORGE_PROJECT_ID').orNull
    if (!projectId) {
        throw new GradleException('Set CURSEFORGE_PROJECT_ID and CURSEFORGE_TOKEN to publish to CurseForge')
    }
    apiToken = providers.environmentVariable('CURSEFORGE_TOKEN').orNull
    def mainFile = upload(projectId, tasks.jar)
    mainFile.releaseType = 'release'
    mainFile.changelog = releaseNotes.get()
    mainFile.changelogType = 'markdown'
    mainFile.addModLoader('NeoForge')
    mainFile.addGameVersion(minecraft_version)
    mainFile.addJavaVersion('Java 21')
}
