plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('visualqa')) {
                // dev-only screenshot harness (see client/VisualQa.java)
                systemProperty 'nostalgiaskills.visualqa', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Dev-only multiplayer scenario (tools/qa/multiplayer_scenario.sh, client/MultiplayerQa.java): one dedicated
        // server and two real clients in separate game directories. -PmpqaAlpha / -PmpqaBeta pick the scenario role.
        mpqaServer {
            server()
            gameDirectory = file('run_mpqa/server')
            programArgument '--nogui'
        }
        mpqaAlpha {
            client()
            gameDirectory = file('run_mpqa/alpha')
            programArguments.addAll('--username', 'Alpha')
            systemProperty 'nostalgiaskills.mpqa', (project.findProperty('mpqaAlpha') ?: 'alpha').toString()
            systemProperty 'nostalgiaskills.mpqa.address', '127.0.0.1:25565'
        }
        mpqaBeta {
            client()
            gameDirectory = file('run_mpqa/beta')
            programArguments.addAll('--username', 'Beta')
            systemProperty 'nostalgiaskills.mpqa', (project.findProperty('mpqaBeta') ?: 'beta').toString()
            // through tools/qa/latency_proxy.py
            systemProperty 'nostalgiaskills.mpqa.address', '127.0.0.1:25566'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Domain tests also validate the complete bundled 480-node dataset.
    systemProperty 'nostalgiaskills.dataRoot', file('src/main/resources/data/nostalgiaskills').absolutePath
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forward the console to the dev server so scripted scenarios (tools/qa/reload_scenario.sh) can type commands.
tasks.matching { it.name == 'runServer' || it.name == 'runMpqaServer' }.configureEach {
    standardInput = System.in
}

// Offline tree validation for authors: ./gradlew validateTree [-PtreeDir=<datapack>/data] [-PtreeId=ns:main]
tasks.register('validateTree', JavaExec) {
    group = 'verification'
    description = 'Validates skill tree JSON outside the game with the same parser the server uses.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nostalgiacraft.skills.graph.TreeValidatorCli'
    args = [project.findProperty('treeDir') ?: 'src/main/resources/data', project.findProperty('treeId') ?: 'nostalgiaskills:main']
}
