def copyKubeJsProbe = tasks.register('copyKubeJsProbe', Copy) {
    from 'src/packTest/kubejs'
    into 'run-pack/kubejs'
}

tasks.matching { it.name == 'runPackGameTestServer' }.configureEach {
    dependsOn copyKubeJsProbe
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'runPackGameTestServer' }) {
        def missing = packTestJars.findAll { !file("${pack_mods_dir}/${it}").exists() }
        if (missing) {
            throw new GradleException("Pack jars missing from ${pack_mods_dir} (set pack_mods_dir in gradle.properties): ${missing.join(', ')}")
        }
    }
}

dependencies {
    packTestRuntimeOnly files(packTestJars.collect { "${pack_mods_dir}/${it}" })
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") {
        transitive = false
    }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:jade:${jade_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:champions-unofficial:${champions_version}") {
        transitive = false
    }
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.test.java.srcDirs = ['test']

test {
    useJUnitPlatform()
    systemProperty 'nostalgiaskills.dataRoot', file('src/main/resources/data/nostalgiaskills').absolutePath
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.matching { it.name == 'runServer' || it.name == 'runMpqaServer' }.configureEach {
    standardInput = System.in
}

tasks.register('validateTree', JavaExec) {
    group = 'verification'
    description = 'Validates the skill catalog and generates one tree outside the game: -PtreeDir=<data dir> -Pseed=<n>'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nostalgiacraft.skills.generation.CatalogValidatorCli'
    args = [project.findProperty('treeDir') ?: 'src/main/resources/data', project.findProperty('seed') ?: '0']
}

tasks.register('previewTree', JavaExec) {
    group = 'verification'
    description = 'Draws the generated tree shape to a PNG: -Pclasses=6 -Pskills=100 -Pout=build/preview/tree.png'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.nostalgiacraft.skills.generation.TreePreviewCli'
    systemProperty 'java.awt.headless', 'true'
    args = [project.findProperty('classes') ?: '6', project.findProperty('skills') ?: '100',
            project.findProperty('out') ?: 'build/preview/tree.png']
}
