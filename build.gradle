plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    packTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.packTest)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('visualqa')) {
                systemProperty 'nostalgiaskills.visualqa', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        mpqaServer {
            server()
            gameDirectory = file('run_mpqa/server')
            programArgument '--nogui'
        }
        mpqaAlpha {
            client()
            gameDirectory = file('run_mpqa/alpha')
            programArguments.addAll('--username', 'Alpha')
            systemProperty 'nostalgiaskills.mpqa', (project.findProperty('mpqaAlpha') ?: 'alpha').toString()
            systemProperty 'nostalgiaskills.mpqa.address', '127.0.0.1:25565'
        }
        mpqaBeta {
            client()
            gameDirectory = file('run_mpqa/beta')
            programArguments.addAll('--username', 'Beta')
            systemProperty 'nostalgiaskills.mpqa', (project.findProperty('mpqaBeta') ?: 'beta').toString()
            systemProperty 'nostalgiaskills.mpqa.address', '127.0.0.1:25566'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        packGameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.packTest
            gameDirectory = file('run-pack')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

